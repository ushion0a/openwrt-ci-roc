name: IPQ807X-LibWrt

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/LiBwrt/LibWrt.git
      repo_branch: 25.12-nss
      config_file: configs/IPQ807X.config
      firmware_tag: IPQ807X
      kernel_file: kernel-6.12
      artifact_prefix: IPQ807X
      manifest_file: libwrt-qualcommax-ipq807x.manifest
      release_summary: >-
        这是基于 LibWrt 上游源码、开启 NSS 的精简固件，使用 Argon 主题，仅额外选择 WireGuard、BanIP、DDNS/Cloudflare、Tailscale、dmesg、htop 和 nano；其余基础软件由 LibWrt 按目标设备依赖自动选择。
