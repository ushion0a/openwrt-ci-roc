name: x86-64-ImmortalWrt

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/immortalwrt/immortalwrt.git
      repo_branch: openwrt-25.12
      config_file: configs/x86-64.config
      firmware_tag: x86-64
      kernel_file: kernel-6.12
      artifact_prefix: x86.64
      manifest_file: immortalwrt-x86-64-generic.manifest
      remove_sqm_scripts_nss: true
      release_summary: >-
        这是基于 ImmortalWrt 官方源码制作的精简固件，使用 Argon 主题，仅额外选择 WireGuard、BanIP、DDNS/Cloudflare、Tailscale、dmesg、htop 和 nano；其余基础软件由 ImmortalWrt 按目标设备依赖自动选择。
